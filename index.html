<style>
  * { box-sizing: border-box; }
  :root { --bg:#f1f4f8; --card:#fff; --ink:#1b2430; --mut:#647084; --line:#e2e7ef; --accent:#0e7490; --accent-ink:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1418; --card:#1a2129; --ink:#e9edf2; --mut:#93a0b0; --line:#2a333f; --accent:#4cc3e8; --accent-ink:#062832; } }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); line-height:1.45; }
  .box { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 20px; }
  h1 { font-size:20px; font-weight:800; letter-spacing:-.02em; margin:0 0 4px; }
  p { font-size:13.5px; color:var(--mut); margin:0 0 16px; }
  label { display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin-bottom:6px; }
  input { width:100%; font-family:inherit; font-size:16px; padding:12px; border:1px solid var(--line); border-radius:11px; background:var(--bg); color:var(--ink); }
  button { width:100%; margin-top:10px; min-height:46px; background:var(--accent); color:var(--accent-ink); border:0; border-radius:11px;
    font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; }
  button[disabled] { opacity:.6; cursor:default; }
  .msg { font-size:13px; margin-top:11px; min-height:18px; }
  .msg.err { color:#dc2626; font-weight:600; }
  .hint { font-size:11.5px; color:var(--mut); margin-top:14px; }
</style>

  }
  function show(html) { document.open(); document.write(html); document.close(); }

  async function attempt(phrase, remember) {
    go.disabled = true; msg.className = 'msg'; msg.textContent = 'Unlocking…';
    try {
      var html = await open(phrase);
      if (remember) { try { localStorage.setItem(KEY, phrase); } catch (e) {} }
      show(html);
    } catch (e) {
      try { localStorage.removeItem(KEY); } catch (e2) {}
      go.disabled = false; msg.className = 'msg err'; msg.textContent = 'That passphrase does not match.';
      pw.value = ''; pw.focus();
    }
  }
  document.getElementById('gate').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (pw.value) attempt(pw.value, true);
  });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) attempt(saved, false); else pw.focus();
})();
</script>
</body>
</html>
